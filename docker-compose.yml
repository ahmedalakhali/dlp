version: "3.8"
services:
  tika:
    image: apache/tika:2.9.1
    container_name: dlp-tika
    ports:
      - "9998:9998"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 3
